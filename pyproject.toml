[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r-ggpi"
version = "1.0.1"
description = "Robust Graph-Grouped Permutation Importance for collinearity-resilient feature attribution"
readme = "README.md"
authors = [
    { name = "Deepak Pandey", email = "eaheog@gmail.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "networkx>=2.6.0",
    "joblib>=1.0.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/deepnovus/r-ggpi"
Repository = "https://github.com/deepnovus/r-ggpi"